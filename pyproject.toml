[project]
name = "cognitive-miniworld"
version = "0.8.0"
description = "ViabilityGrid: a deterministic testbed for cognitive primitives"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "msgspec>=0.21.1",
]

[project.urls]
Repository = "https://github.com/kmosoti/cognitive-miniworld"
Issues = "https://github.com/kmosoti/cognitive-miniworld/issues"
GORDIAN = "https://github.com/users/kmosoti/projects/8"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cmw"

[tool.uv]
required-version = "==0.12.5"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.10",
    "ruff>=0.16.4",
    "ty>=0.0.75",
]

# ---------------------------------------------------------------- lint ----
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "TID", "N"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Determinism invariant: randomness flows through cmw.rng named streams."
"uuid".msg = "Determinism invariant: identifiers must be deterministic, not uuid4."
"numpy.random".msg = "Determinism invariant: use cmw.rng named streams, not numpy module-global RNG."

# --------------------------------------------------------------- types ----
[tool.ty.environment]
python-version = "3.14"

# --------------------------------------------------------------- tests ----
[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "property: Hypothesis property test.",
    "replay: deterministic replay gate (lands with MW-003).",
    "smoke: fast experiment smoke run (lands with MW-005).",
    "freethreaded: requires the CPython free-threaded build with the GIL disabled.",
    "performance: relative concurrency performance gate; wall time is never digested.",
]
